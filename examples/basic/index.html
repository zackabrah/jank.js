<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jank.js · basic demo</title>
    <link rel="stylesheet" href="../../packages/jank/src/panel/panel.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="demo jl">
      <canvas id="scene" role="img" aria-label="A grid of rotating cubes"></canvas>
      <section class="demo-controls" aria-labelledby="scene-controls">
        <header>
          <h1 id="scene-controls">Jank demo</h1>
          <span><output id="host-frames" aria-live="off">0</output> frames</span>
        </header>
        <p id="demo-error" role="alert" hidden></p>
        <div class="controls">
          <label>Objects
            <select id="objects" class="jl-select">
              <option>16</option>
              <option selected>36</option>
              <option>64</option>
              <option>144</option>
              <option>256</option>
            </select>
          </label>
          <label>Extra CPU per frame
            <select id="cpu-load" class="jl-select">
              <option value="0">None</option>
              <option value="2">2 ms</option>
              <option value="6">6 ms</option>
            </select>
          </label>
        </div>
        <div class="controls">
          <button id="pause" type="button" class="jl-btn">Pause motion</button>
          <button id="hitch" type="button" class="jl-btn">Trigger 80 ms hitch</button>
        </div>
        <div class="controls">
          <button id="capture-hitch" type="button" class="jl-btn jl-primary">Capture next hitch</button>
          <span><output id="archive-count">0</output> captures</span>
        </div>
        <div class="controls">
          <label class="marker">Event label
            <input id="event-label" class="jl-input" value="Demo marker" maxlength="240" />
          </label>
          <button id="add-event" type="button" class="jl-btn">Add marker</button>
        </div>
        <p id="action-status" role="status"></p>
        <details>
          <summary>Sources &amp; files</summary>
          <div class="controls">
            <label>GPU timing
              <select id="gpu-example" class="jl-select">
                <option value="webgl2" selected>WebGL2 GPU timer</option>
                <option value="disabled">Disabled</option>
                <option value="synthetic">SIMULATED pass timings</option>
                <option value="pending">Pending</option>
                <option value="unsupported">Unsupported</option>
                <option value="error">Error</option>
              </select>
            </label>
          </div>
          <div class="controls">
            <button id="loading" type="button" class="jl-btn">Run loading example</button>
            <span id="loading-status">No run yet</span>
          </div>
          <div class="controls">
            <button id="clear-trace" type="button" class="jl-btn">Clear trace entries</button>
            <span><output id="trace-count" aria-live="off">0</output> entries</span>
          </div>
          <div class="controls">
            <label><input id="counter-error" type="checkbox" /> Simulate counter error</label>
          </div>
          <label class="file-label">Validate a recording
            <input id="recording-file" type="file" accept=".json,application/json" />
          </label>
          <p id="recording-summary" role="status"></p>
          <p id="import-error" role="alert" hidden></p>
        </details>
        <details>
          <summary>Panel controls</summary>
          <fieldset class="controls">
            <legend>Panel size</legend>
            <button id="panel-line" type="button" class="jl-btn">Show LINE</button>
            <button id="panel-mini" type="button" class="jl-btn">Show MINI</button>
            <button id="panel-full" type="button" class="jl-btn">Show FULL</button>
          </fieldset>
          <div class="controls">
            <button id="panel-toggle" type="button" class="jl-btn">Detach panel</button>
            <label><input id="scope-demand" type="checkbox" /> Keep scopes on</label>
          </div>
          <div class="controls">
            <button id="profiler-toggle" type="button" class="jl-btn">Stop profiler</button>
            <span id="profiler-state">Running</span>
          </div>
        </details>
      </section>
      <div id="panel-mount"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
