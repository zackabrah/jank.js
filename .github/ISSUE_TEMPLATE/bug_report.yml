name: Bug report
description: The panel, viewer, recordings or an adapter behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest setup that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: jank.js version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 153 on macOS
    validations:
      required: true
  - type: textarea
    id: recording
    attributes:
      label: Recording
      description: Optional. Attach an exported recording that shows the problem, with private application labels or values removed.
