name: Preview checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Match @playwright/test exactly; browsers and OS dependencies are already installed.
    # Avoid per-run APT mirror updates, which can stall before any browser tests start.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Match the mounted workspace/home owner; Firefox refuses root with another user's home.
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@v6
      # Checkout's temporary Git config does not persist into container install hooks.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm test:package
      - run: pnpm test:browser --project=chromium --project=webkit
      # Linux headless Firefox cannot create the WebGL contexts used by the demo.
      # Xvfb provides a display for real rendering tests without requiring a physical GPU.
      # Run one headed browser at a time on the shared display; retain traces for CI-only failures.
      - run: xvfb-run -a pnpm test:browser --project=firefox --headed --workers=1 --trace=retain-on-failure
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  visuals:
    # Native system-font baselines are intentionally tied to macOS 26 / arm64.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
