name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify and pack only; do not publish to npm"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # Match the browser release gate's supported CI platform.
    runs-on: macos-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Use the verified npm CLI with trusted publishing support
        run: npm install --global npm@11.20.0
      - name: Verify the release tag and publication channel
        id: release
        run: node scripts/release/verify-npm-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium firefox webkit
      - name: Run the release gate and pack
        run: pnpm release:prepare
      - name: Verify the built identity and preview publication
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          node scripts/release/verify-npm-release.mjs --built
          npm publish ./artifacts/npm/*.tgz --tag "$NPM_DIST_TAG" --dry-run --ignore-scripts
      - uses: actions/upload-artifact@v6
        with:
          name: npm-${{ github.ref_name }}
          path: artifacts/npm/*.tgz
          if-no-files-found: error
      - name: Publish the verified tarball with npm trusted publishing
        id: publish
        if: ${{ !inputs.dry_run }}
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish ./artifacts/npm/*.tgz --tag "$NPM_DIST_TAG" --ignore-scripts
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: npm-release-failure-traces
          path: test-results
          retention-days: 7
      - name: Summarise the release
        if: ${{ !cancelled() }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          OUTCOME: ${{ steps.publish.outcome }}
          TAG: ${{ github.ref_name }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          {
            echo "### npm"
            echo
            for tarball in artifacts/npm/*.tgz; do
              if [ -f "$tarball" ]; then
                echo "Packed \`$(basename "$tarball")\` ($(wc -c < "$tarball" | tr -d ' ') bytes) from \`$TAG\`."
              fi
            done
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: nothing was published."
            elif [ "$OUTCOME" = "success" ]; then
              echo "Published to npm under the \`$NPM_DIST_TAG\` tag."
            elif [ "$OUTCOME" = "skipped" ]; then
              echo "An earlier step failed: nothing was published."
            else
              echo "Publishing failed. See the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
