name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:package
      - run: pnpm pack --pack-destination artifacts
      - name: Summarise coverage and package size
        if: ${{ !cancelled() }}
        run: node scripts/ci/summary.mjs check
      - uses: actions/upload-artifact@v6
        with:
          name: jank-js-build-${{ matrix.os }}
          path: |
            artifacts/*.tgz
            dist-package
      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          name: readme-unit-results
          if-no-files-found: error
          path: |
            artifacts/unit/results.json
            coverage/coverage-summary.json

  browser:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Summarise browser results and accuracy
        if: ${{ !cancelled() }}
        run: node scripts/ci/summary.mjs browser
      - uses: actions/upload-artifact@v6
        with:
          name: readme-browser-results
          if-no-files-found: error
          path: artifacts/e2e/results.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7

  readme:
    name: Generate README assets
    needs: [check, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v6
        with:
          name: readme-unit-results
          path: .
      - uses: actions/download-artifact@v6
        with:
          name: readme-browser-results
          path: artifacts/e2e
      - name: Generate chips and social card from this run's results
        run: pnpm docs:assets
      - uses: actions/upload-artifact@v6
        with:
          name: readme-assets
          if-no-files-found: error
          path: |
            docs/readme/badge-*.svg
            docs/readme/social-preview.svg
            docs/readme/social-preview.png

  version:
    name: Version merged PRs
    needs: [check, browser, readme]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created: ${{ steps.release.outputs.created }}
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Tag a merged release
        id: release
        run: node scripts/release/version-main.mjs tag
      - name: Build the tagged package identity
        if: steps.release.outputs.created == 'true' && steps.release.outputs.commit == github.sha
        run: |
          pnpm install --frozen-lockfile
          pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v6
        if: steps.release.outputs.created == 'true' && steps.release.outputs.commit == github.sha
        with:
          name: versioned-jank-js-${{ steps.release.outputs.version }}
          path: artifacts/*.tgz
      - name: Plan pending PR version bumps
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/version-main.mjs plan
      - if: steps.plan.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.changed == 'true'
        run: pnpm check && pnpm test:package
      - if: steps.plan.outputs.changed == 'true'
        uses: actions/download-artifact@v6
        with:
          name: readme-browser-results
          path: artifacts/e2e
      - if: steps.plan.outputs.changed == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Regenerate chips and social card for the release version
        if: steps.plan.outputs.changed == 'true'
        run: pnpm docs:assets
      - name: Prepare the verified release branch
        if: steps.plan.outputs.changed == 'true'
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release/version-main.mjs prepare
      - name: Summarise the version
        if: ${{ !cancelled() }}
        env:
          RELEASE_PR: ${{ steps.prepare.outputs.url }}
          COMMIT: ${{ steps.release.outputs.commit }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "### Version"
            echo
            if [ -n "$VERSION" ]; then
              echo "Release v$VERSION is tagged at ${COMMIT:0:8}."
            fi
            if [ -n "$RELEASE_PR" ]; then
              echo "[Open the release PR]($RELEASE_PR)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
